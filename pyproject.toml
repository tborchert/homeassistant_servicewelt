[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "homeassistant-servicewelt"
version = "0.1.0"
description = "Home Assistant integration for Stiebel Eltron Servicewelt"
authors = ["Tom Borchert <tborchert@gmail.com>"]
readme = "README.md"
packages = [{include = "servicewelt", from = "custom_components"}]

[tool.poetry.dependencies]
python = ">=3.13.2,<3.14"
aiohttp = "*"
beautifulsoup4 = ">=4.12.0"

[tool.poetry.group.dev.dependencies]
homeassistant = "^2025.6.3"
pytest = ">=8.0.0"
pytest-asyncio = "^1.0.0"
ruff = ">=0.11.7"
