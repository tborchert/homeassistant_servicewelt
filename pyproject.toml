[project]
name = "homeassistant-servicewelt"
version = "0.1.0"
description = "Home Assistant integration for Stiebel Eltron Servicewelt"
authors = [
    {name = "Tom Borchert", email = "tborchert@gmail.com"}
]
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "homeassistant>=2024.1.0",
    "aiohttp",
    "beautifulsoup4>=4.12.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-homeassistant-custom-component>=0.13.0",
    "pytest-asyncio>=0.24.0",
    "ruff>=0.11.7",
]

[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.7"
pytest = "^8.0.0"
pytest-homeassistant-custom-component = "^0.13.0"
pytest-asyncio = "^0.24.0"

