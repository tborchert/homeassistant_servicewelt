[project]
name = "homeassistant-servicewelt"
version = "0.1.0"
description = "Home Assistant integration for Stiebel Eltron Servicewelt"
authors = [{name = "Tom Borchert", email = "tborchert@gmail.com"}]
readme = "README.md"
requires-python = ">=3.13.2,<3.14"
dependencies = [
    "aiohttp",
    "beautifulsoup4>=4.12.0",
]

[dependency-groups]
dev = [
    "homeassistant==2025.6.3",
    "pytest==8.3.5",
    "pytest-asyncio==1.0.0",
    "ruff>=0.11.7",
]

[tool.hatch.build.targets.wheel]
packages = ["custom_components/servicewelt"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
