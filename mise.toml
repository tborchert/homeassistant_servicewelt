[tools]
python = "3.13"
uv = "latest"

[tasks.setup]
description = "Install project dependencies"
run = "uv sync"

[tasks.lint]
description = "Format and lint the codebase"
run = """
uv run ruff format .
uv run ruff check . --fix
"""

[tasks.develop]
description = "Run a local Home Assistant instance with the integration loaded"
run = """
if [ ! -d "${PWD}/config" ]; then
  mkdir -p "${PWD}/config"
  uv run hass --config "${PWD}/config" --script ensure_config
fi

# Set the path to custom_components
## This lets us have the structure we want <root>/custom_components/servicewelt
## while at the same time have Home Assistant configuration inside <root>/config
## without resorting to symlinks.
export PYTHONPATH="${PYTHONPATH}:${PWD}/custom_components"

uv run hass --config "${PWD}/config" --debug
"""

[tasks.test]
description = "Run the unit tests"
run = "uv run pytest"

[tasks.test-e2e]
description = "Run end-to-end tests: Home Assistant + fake Servicewelt portal in Docker"
run = "uv run pytest tests/e2e -m e2e"

[tasks.validate-hassfest]
description = "Run Home Assistant's hassfest manifest validation on the local checkout"
run = "docker run --rm -v \"${PWD}:/github/workspace\" ghcr.io/home-assistant/hassfest"

[tasks.validate-hacs]
description = "Run HACS validation (checks the repo as published on GitHub, not local files)"
run = """
if [ -z "${GITHUB_TOKEN}" ]; then
  echo "Set GITHUB_TOKEN to a GitHub token (read-only public access is enough)" >&2
  exit 1
fi
docker run --rm \
  -e GITHUB_TOKEN \
  -e INPUT_CATEGORY=integration \
  -e INPUT_IGNORE=brands \
  -e INPUT_REPOSITORY=tborchert/homeassistant_servicewelt \
  -e INPUT_COMMENT=false \
  ghcr.io/hacs/action:main
"""
